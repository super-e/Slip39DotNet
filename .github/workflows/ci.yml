name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      
    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        # Tokenless uploads are rate limited per IP across all of GitHub's shared
        # runners, which is why every run was failing with HTTP 429. Set the
        # CODECOV_TOKEN repository secret to upload under this project's own quota.
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    # Uploading the CodeQL results writes the repository's code scanning alerts, which the
    # default GITHUB_TOKEN is not allowed to do. Without this the analysis ran, found its
    # results, and then failed at the upload with "Resource not accessible by integration" —
    # on every push to main since the workflow was written. Pull request runs were unaffected,
    # which is why the failure stayed invisible: the checks people look at were green.
    #
    # Scoped to this job on purpose: build-artifacts declares its own contents: write for the
    # release upload, so neither job depends on the repository's default token scope.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Fail on vulnerable packages
      run: |
        set -euo pipefail
        # `dotnet list package --vulnerable` reports what it finds and exits 0 either way, so
        # this step used to be informational only: a vulnerable transitive dependency would have
        # been printed into a green log and nothing more. The exit code has to come from reading
        # the report.
        report=$(dotnet list package --vulnerable --include-transitive)
        echo "$report"
        if grep -q 'has the following vulnerable packages' <<< "$report"; then
          echo "::error::Vulnerable NuGet packages detected — see the report above."
          exit 1
        fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        queries: security-and-quality
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'release'

    # Writing release assets needs contents: write. Stated explicitly so that adding a
    # workflow-level default later cannot silently take it away.
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build Release
      run: dotnet build --configuration Release --no-restore
      
    - name: Publish CLI - Windows x64
      run: dotnet publish Slip39.Console --configuration Release --runtime win-x64 --self-contained true --output ./publish/win-x64
      
    - name: Publish CLI - Linux x64
      run: dotnet publish Slip39.Console --configuration Release --runtime linux-x64 --self-contained true --output ./publish/linux-x64
      
    - name: Publish CLI - macOS x64
      run: dotnet publish Slip39.Console --configuration Release --runtime osx-x64 --self-contained true --output ./publish/osx-x64
      
    - name: Publish CLI - macOS ARM64
      run: dotnet publish Slip39.Console --configuration Release --runtime osx-arm64 --self-contained true --output ./publish/osx-arm64
      
    - name: Create NuGet packages
      run: |
        dotnet pack Slip39.Core --configuration Release --no-build --output ./packages
        
    - name: Archive Windows x64
      run: tar -czf slip39-dotnet-win-x64.tar.gz -C ./publish/win-x64 .
      
    - name: Archive Linux x64
      run: tar -czf slip39-dotnet-linux-x64.tar.gz -C ./publish/linux-x64 .
      
    - name: Archive macOS x64
      run: tar -czf slip39-dotnet-osx-x64.tar.gz -C ./publish/osx-x64 .
      
    - name: Archive macOS ARM64
      run: tar -czf slip39-dotnet-osx-arm64.tar.gz -C ./publish/osx-arm64 .
      
    # One `gh release upload` in place of four `actions/upload-release-asset@v1` steps. That
    # action was archived by GitHub in 2021 and fails on assets it once handled; `gh` ships on
    # the hosted runners and needs no third party. --clobber makes a re-run of a failed release
    # idempotent instead of erroring on an asset that already uploaded.
    - name: Upload release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Through the environment rather than interpolated into the script: a `${{ }}` expansion
        # is pasted into the shell before it runs, so a tag name is script until proven otherwise.
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        gh release upload "$RELEASE_TAG" \
          slip39-dotnet-win-x64.tar.gz \
          slip39-dotnet-linux-x64.tar.gz \
          slip39-dotnet-osx-x64.tar.gz \
          slip39-dotnet-osx-arm64.tar.gz \
          --clobber

    - name: Publish NuGet packages
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      # Read from the environment rather than interpolated into the command line, where the key
      # would be visible to anything that can list processes on the runner. The job-level
      # `if: github.event_name == 'release'` already gates this step; the copy that was here was
      # redundant.
      run: |
        set -euo pipefail
        dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    # Hoisted from the step. A step's own `env:` is not available to that step's `if:`, so
    # `if: env.SONAR_TOKEN != ''` on a step that defined SONAR_TOKEN itself compared '' to '' and
    # skipped the scan every time. The `secrets` context cannot be read from an `if:` directly,
    # so a job-level env is the way to make the condition see the secret.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Not secrets — the project key and organization appear in the project's SonarCloud URL.
      # Kept here rather than in a sonar-project.properties file, which SonarScanner for .NET
      # ignores: it takes its configuration from the `begin` command line.
      SONAR_ORGANIZATION: super-e
      SONAR_PROJECT_KEY: super-e_Slip39DotNet
      # The EU (Frankfurt) region is served by sonarcloud.io. An organization created in another
      # region has a different endpoint and this value has to match it.
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Sonar needs the full history to assign issues to the commit that introduced them.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # The scanner is a Java application; without a JDK the `begin` step fails on a runner that
    # otherwise has everything .NET needs.
    - name: Setup JDK
      if: env.SONAR_TOKEN != ''
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # SonarScanner for .NET, not the generic CLI scanner the `sonarcloud-github-action` runs.
    # C# analysis happens inside MSBuild: `begin` installs the analyzers, the build produces the
    # analysis output, `end` uploads it. The CLI scanner never sees a single C# file, so the job
    # it replaces would have reported a successful scan of nothing — the exact shape of defect
    # this repository has been clearing out.
    #
    # The whole sequence is skipped when SONAR_TOKEN is unset, which is the state of the
    # repository until the secret is configured. Skipped, not failed: an unconfigured optional
    # scanner should not block a merge.
    - name: Begin SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      run: |
        set -euo pipefail
        dotnet tool install --global dotnet-sonarscanner
        dotnet sonarscanner begin \
          /k:"${{ env.SONAR_PROJECT_KEY }}" \
          /o:"${{ env.SONAR_ORGANIZATION }}" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="${{ env.SONAR_HOST_URL }}"

    # --no-incremental on purpose: the scanner can only see code MSBuild actually compiles, and
    # an incremental build that skips an up-to-date project would silently drop it from the
    # analysis.
    - name: Build
      run: dotnet build --configuration Release --no-incremental

    - name: End SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # No coverage is fed to Sonar. It would mean running the ~26-minute suite a second time in
    # this job — which is what was removed here — and re-collecting it in OpenCover format,
    # since Sonar's C# plugin does not read the Cobertura reports the `test` job produces.
    # Coverage lives in Codecov; this job is static analysis.
